<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1630">
<title>لوحة الأدمن | بطولة الفرسان</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>

<style>
:root{
  --ink:#0f1729;--muted:#6b7590;--navy:#0e1630;--paper:#f4f6fb;--white:#fff;--line:#e4e9f2;
  --blue:#4f6ef7;--blue-2:#6a83ff;--mint:#12c48b;--mint-soft:#e3f9f0;
  --purple:#7c5cf0;--amber:#f5a623;--amber-soft:#fff4e0;
  --red:#ef4b5e;--red-soft:#ffe9ec;--gold:#e8b64c;--gold-soft:#fff8e0;
  --shadow-sm:0 2px 8px rgba(20,32,68,.06);
  --shadow:0 8px 28px rgba(20,32,68,.09);
  --trans:.2s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --ink:#e6ebf7;--muted:#8a94b3;--navy:#070c1c;--paper:#0b1020;--white:#141c33;--line:#232d4a;
  --blue:#6a83ff;--mint:#2edda0;--mint-soft:#0f3a2b;--purple:#9c7eff;
  --amber:#ffb84d;--amber-soft:#3a2b10;--red:#ff6b7d;--red-soft:#3d1620;
  --gold:#ffd066;--gold-soft:#3d3010;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91a1ff;outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ============ LOGIN ============ */
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0e1630,#1a2444)}
.login-card{width:min(100%,380px);background:var(--white);border-radius:24px;padding:36px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
.login-card .lock-icon{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#5e7cff,#4257c9);color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 20px;box-shadow:0 14px 34px rgba(79,110,247,.4)}
.login-card h1{margin:0 0 6px;font-size:24px;font-weight:900;letter-spacing:-.03em}
.login-card p{margin:0 0 26px;color:var(--muted);font-size:13px;font-weight:600}
.login-card input{width:100%;padding:15px 16px;border:2px solid var(--line);border-radius:13px;background:var(--paper);font-size:16px;text-align:center;letter-spacing:.1em;margin-bottom:14px;transition:var(--trans)}
.login-card input:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 4px rgba(94,124,255,.15)}
.login-card button{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,#5e7cff,#4257c9);color:#fff;font-weight:900;font-size:15px;box-shadow:0 12px 28px rgba(79,110,247,.4);transition:var(--trans)}
.login-card button:active{transform:scale(.97)}
.login-error{color:var(--red);font-size:12px;font-weight:700;margin-top:10px;min-height:18px}

/* ============ HEADER ============ */
.app-header{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.app-header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
.app-header .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px}
.app-header .brand-sym{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:17px;flex:none}
.app-header .brand small{display:block;font-size:10px;color:#a9b4d8;font-weight:600}
.app-header .logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;transition:var(--trans)}
.app-header .logout-btn:active{transform:scale(.95)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#2edda0;box-shadow:0 0 0 4px rgba(46,221,160,.25);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============ MAIN ============ */
.app-main{max-width:720px;margin:0 auto;padding:16px 14px}
.section{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
.section-title i{color:var(--blue)}
.section-subtitle{font-size:11px;color:var(--muted);margin:3px 0 0;font-weight:600}

/* ============ METRICS ============ */
.mini-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mini-metric{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow-sm)}
.mini-metric b{display:block;font-size:22px;font-weight:900;line-height:1.1;letter-spacing:-.03em}
.mini-metric small{font-size:10px;color:var(--muted);font-weight:800}
.mini-metric.blue b{color:var(--blue)}
.mini-metric.mint b{color:#0a9e6e}
.mini-metric.amber b{color:#d6870d}
.mini-metric.gold b{color:#b8860b}

/* ============ BUTTONS ============ */
.btn{border-radius:11px;padding:12px 16px;font-weight:800;font-size:13px;transition:var(--trans);display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.3}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#5e7cff,#4257c9);color:#fff;box-shadow:0 8px 20px rgba(79,110,247,.28)}
.btn-secondary{background:#e6eaff;color:#4257c9}
.btn-quiet{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-success{background:var(--mint-soft);color:#0a9e6e}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d19b2e);color:#2a1e05;box-shadow:0 8px 20px rgba(232,182,76,.32)}
.btn-small{padding:9px 13px;font-size:12px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ FORM ============ */
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:800}
.field input,.field select,.field textarea,.input{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);padding:12px 13px;color:var(--ink);transition:var(--trans);font-size:14px}
.field input:focus,.field select:focus,.input:focus{border-color:#8194f4;outline:0;box-shadow:0 0 0 4px rgba(94,124,255,.12);background:var(--white)}

/* ============ TEAMS LIST ============ */
.teams-list{display:grid;gap:8px}
.team-row{display:flex;align-items:center;gap:11px;padding:11px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);transition:var(--trans)}
.team-row:active{transform:scale(.99)}
.team-row .avatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:16px;font-weight:900;color:#fff;flex:none}
.team-row .info{flex:1;min-width:0}
.team-row .info b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-row .info small{font-size:10.5px;color:var(--muted);font-weight:700}
.team-row .actions{display:flex;gap:5px;flex:none}
.team-row .actions button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:13px;transition:var(--trans)}
.team-row .actions .edit{background:#e6eaff;color:#4257c9}
.team-row .actions .del{background:var(--red-soft);color:var(--red)}
.team-row .actions button:active{transform:scale(.9)}

/* ============ MATCHES LIST ============ */
.matches-list{display:grid;gap:10px}
.match-card{padding:13px;border-radius:13px;background:var(--paper);border:1.5px solid var(--line);transition:var(--trans)}
.match-card.done{background:linear-gradient(150deg,var(--white),var(--mint-soft));border-color:#c3f3df}
.match-card.live{border-color:var(--red);box-shadow:0 0 0 1.5px var(--red)}
.match-card.waiting{opacity:.55}
.match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;font-weight:800;color:var(--muted)}
.match-head .round-tag{background:#e6eaff;color:#4257c9;padding:3px 10px;border-radius:99px;font-size:10px}
.match-head .status-tag{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:900}
.match-head .status-tag.done{background:var(--mint-soft);color:#0a9e6e}
.match-head .status-tag.live{background:var(--red-soft);color:var(--red);animation:pulse 1.5s infinite}
.match-head .status-tag.waiting{background:var(--line);color:var(--muted)}
.match-teams{display:grid;gap:6px}
.team-line{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:var(--white);border-radius:10px;font-size:13px;font-weight:700}
.team-line.winner{background:var(--mint-soft);color:#0a9e6e;font-weight:800}
.team-line.loser{opacity:.5}
.team-line .left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.team-line .avatar{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;flex:none}
.team-line .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-line .score{font-size:15px;font-weight:900;color:var(--muted);min-width:28px;text-align:center}
.team-line.winner .score{color:#0a9e6e}
.match-btn{margin-top:10px;width:100%;padding:11px;border-radius:11px;background:linear-gradient(135deg,#5e7cff,#4257c9);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:var(--trans)}
.match-btn:active{transform:scale(.97)}
.match-btn.secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}

/* ============ SCORE MODAL ============ */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(8,14,32,.7);backdrop-filter:blur(6px);display:grid;place-items:end center;animation:fade .2s ease}
.modal{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--white);border-radius:24px 24px 0 0;padding:22px;box-shadow:0 -20px 60px rgba(0,0,0,.3);animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.modal h2{margin:0 0 5px;font-size:19px;font-weight:900;text-align:center}
.modal p{margin:0 0 14px;font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.score-inputs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:20px 0 14px;text-align:center}
.score-inputs .team-name{font-size:12px;font-weight:900;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-inputs input{text-align:center;font-size:30px;font-weight:900;padding:16px 4px;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:14px}
.score-inputs input:focus{border-color:var(--blue);background:var(--white);outline:0;box-shadow:0 0 0 4px rgba(94,124,255,.15)}
.score-vs{font-size:14px;font-weight:900;color:var(--blue);align-self:end;padding-bottom:22px}
.penalty-row{margin-top:10px;padding:13px;border-radius:13px;background:#e6eaff;border:1.5px solid #ccd5ff}
[data-theme="dark"] .penalty-row{background:#1a1f3a;border-color:#2d3560}
.penalty-row label{font-size:11.5px;font-weight:900;color:#4257c9;display:block;margin-bottom:8px}
[data-theme="dark"] .penalty-row label{color:#a5b3ff}
.penalty-row .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.penalty-row input{text-align:center;font-size:18px;font-weight:900;padding:12px 8px;background:var(--white);border:1.5px solid #ccd5ff;border-radius:11px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.modal-actions .btn{padding:15px}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;padding:13px 20px;border-radius:13px;background:var(--navy);color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.3);font-size:13px;font-weight:800;max-width:calc(100vw - 40px);opacity:0;pointer-events:none;transition:var(--trans);display:flex;align-items:center;gap:10px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}
.toast.success{background:var(--mint)}
.toast i{font-size:16px}

/* ============ EMPTY ============ */
.empty{text-align:center;color:var(--muted);padding:30px 15px;font-size:12.5px;font-weight:600}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:.35}

/* ============ BOTTOM BAR ============ */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:40;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.bottom-bar .btn{padding:12px 8px;font-size:12px}

/* ============ HIDDEN ============ */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="lock-icon"><i class="fa-solid fa-user-shield"></i></div>
    <h1>لوحة الأدمن</h1>
    <p>بطولة الفرسان · مدارس الفرسان</p>
    <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
    <button id="loginBtn"><i class="fa-solid fa-unlock"></i> دخول</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden">

  <!-- Header -->
  <div class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <div class="brand-sym"><i class="fa-solid fa-trophy"></i></div>
        <div>لوحة الأدمن<small>مدارس الفرسان</small></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="live-dot" id="liveDot" title="متصل"></span>
        <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="app-main">

    <!-- Metrics -->
    <div class="mini-metrics">
      <div class="mini-metric blue"><b id="mTeams">0</b><small>فريق</small></div>
      <div class="mini-metric mint"><b id="mPlayed">0</b><small>منتهية</small></div>
      <div class="mini-metric amber"><b id="mGoals">0</b><small>هدف</small></div>
      <div class="mini-metric gold"><b id="mHistory">0</b><small>بطولة</small></div>
    </div>

    <!-- Matches -->
    <div class="section">
      <div class="section-head">
        <div>
          <h2 class="section-title"><i class="fa-solid fa-futbol"></i> المباريات</h2>
          <p class="section-subtitle">اضغط أي مباراة لإدخال النتيجة</p>
        </div>
        <button class="btn btn-quiet btn-small" id="refreshBtn"><i class="fa-solid fa-rotate"></i></button>
      </div>
      <div id="matchesContainer"></div>
    </div>

    <!-- Teams -->
    <div class="section">
      <div class="section-head">
        <div>
          <h2 class="section-title"><i class="fa-solid fa-users"></i> الفرق</h2>
          <p class="section-subtitle" id="teamsCount">0 فريق</p>
        </div>
        <button class="btn btn-primary btn-small" id="addTeamBtn"><i class="fa-solid fa-plus"></i> جديد</button>
      </div>
      <div class="teams-list" id="teamsContainer"></div>
    </div>

  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="btn btn-success" id="genTourBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> بطولة</button>
    <button class="btn btn-quiet" id="historyBtn"><i class="fa-solid fa-crown"></i> سجل</button>
    <button class="btn btn-quiet" id="viewSiteBtn"><i class="fa-solid fa-arrow-up-right-from-square"></i> الموقع</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal Root -->
<div id="modalRoot"></div>

<script>
"use strict";

/* ============================================================
   API
   ============================================================ */
const API = {
  adminPass: sessionStorage.getItem('adminPass') || '',
  async req(path, opts = {}){
    const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
    if(this.adminPass) headers['x-admin-pass'] = this.adminPass;
    const r = await fetch(path, { ...opts, headers });
    if(!r.ok){
      const err = await r.json().catch(()=>({}));
      throw new Error(err.error || 'خطأ');
    }
    return r.json();
  },
  get: (p) => API.req(p),
  post: (p,b) => API.req(p,{method:'POST',body:JSON.stringify(b)}),
  put: (p,b) => API.req(p,{method:'PUT',body:JSON.stringify(b)}),
  del: (p) => API.req(p,{method:'DELETE'}),
  isAdmin(){ return !!this.adminPass; }
};

/* ============================================================
   STATE
   ============================================================ */
const state = {
  teams: [],
  tournament: null,
  history: [],
  socket: null,
  selectedTeamId: null
};

const COLORS = ["#5e7cff","#12c48b","#ef4b5e","#8b6aff","#f5a623","#0a9e6e","#d6870d","#4f6ef7","#9c4dd4","#2fb8c4","#e8654a","#586076","#c9358b","#0b8fb5","#a05e1e","#5d7a8c","#7e57c2","#26a69a","#ef5350","#ffa726"];
const EMOJIS = ["⚽","🦅","🦁","🐆","🦈","🐺","🐉","🦂","🐯","🦊","⭐","🔥","⚡","🌟","💫","🏆","🥇","🎯","🚀","👑"];

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const escapeHtml = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function teamById(id){ return state.teams.find(t=>t.id===id); }
function teamColor(team){ return team ? (team.color||"#5e7cff") : "#8890a4"; }
function teamEmoji(team){ return team && team.emoji ? team.emoji : null; }

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type){
  const t = $("#toast");
  const icon = type==="error" ? "fa-circle-exclamation" : type==="success" ? "fa-circle-check" : "fa-circle-info";
  t.innerHTML = '<i class="fa-solid '+icon+'"></i><span>'+escapeHtml(msg)+'</span>';
  t.className = "toast show " + (type||"");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ============================================================
   LOGIN
   ============================================================ */
$("#loginBtn").onclick = doLogin;
$("#passInput").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });

async function doLogin(){
  const pass = $("#passInput").value.trim();
  if(!pass){ $("#loginError").textContent = "أدخل كلمة السر"; return; }
  API.adminPass = pass;
  try {
    await API.get('/api/teams');
    sessionStorage.setItem('adminPass', pass);
    $("#loginScreen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    boot();
  } catch(e){
    API.adminPass = "";
    $("#loginError").textContent = "كلمة السر غلط";
  }
}

function logout(){
  API.adminPass = "";
  sessionStorage.removeItem('adminPass');
  $("#app").classList.add("hidden");
  $("#loginScreen").classList.remove("hidden");
  $("#passInput").value = "";
  $("#loginError").textContent = "";
  if(state.socket) state.socket.disconnect();
}

$("#logoutBtn").onclick = () => {
  if(confirm('تسجيل الخروج؟')) logout();
};

/* ============================================================
   SOCKET.IO
   ============================================================ */
function initSocket(){
  if(typeof io === 'undefined') return;
  state.socket = io();
  state.socket.on('connect', () => {
    $("#liveDot").style.background = '#2edda0';
  });
  state.socket.on('disconnect', () => {
    $("#liveDot").style.background = '#ef4b5e';
  });
  state.socket.on('full:reload', (data) => {
    state.teams = data.teams || [];
    state.tournament = data.tournament || null;
    state.history = data.history || [];
    renderAll();
  });
  state.socket.on('teams:update', (teams) => { state.teams = teams; renderAll(); });
  state.socket.on('tournament:update', (tr) => { state.tournament = tr; renderAll(); });
  state.socket.on('history:update', (h) => { state.history = h; renderAll(); });
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  try {
    const [teams, tournament, history] = await Promise.all([
      API.get('/api/teams'),
      API.get('/api/tournament'),
      API.get('/api/history')
    ]);
    state.teams = teams;
    state.tournament = tournament;
    state.history = history;
    renderAll();
    initSocket();
  } catch(e){
    toast("فشل التحميل: " + e.message, "error");
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function renderAll(){
  renderMetrics();
  renderMatches();
  renderTeams();
}

function renderMetrics(){
  $("#mTeams").textContent = state.teams.length;
  $("#mHistory").textContent = state.history.length;

  let played = 0;
  let goals = 0;
  if(state.tournament && state.tournament.rounds){
    state.tournament.rounds.forEach(r => r.forEach(m => {
      if(m.winner) played++;
      goals += (m.scoreA||0) + (m.scoreB||0);
    }));
  }
  $("#mPlayed").textContent = played;
  $("#mGoals").textContent = goals;
}

function renderMatches(){
  const container = $("#matchesContainer");
  if(!container) return;

  if(!state.tournament || !state.tournament.rounds || state.tournament.rounds.length === 0){
    container.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-trophy"></i>
        لا توجد بطولة. اضغط "بطولة" بالأسفل للتوليد.
      </div>`;
    return;
  }

  const rounds = state.tournament.rounds;
  let html = '<div class="matches-list">';

  rounds.forEach((round, ri) => {
    round.forEach((m, mi) => {
      if(!m.a || !m.b){
        // فقط اعرض المباريات الجاهزة
        return;
      }
      const a = m.a, b = m.b;
      const teamA = teamById(a.id);
      const teamB = teamById(b.id);
      const aWin = m.winner === a.id;
      const bWin = m.winner === b.id;
      const isDone = !!m.winner;
      const isLive = !m.winner;

      const roundName = ri === rounds.length - 1 ? "النهائي"
        : ri === rounds.length - 2 ? "نصف النهائي"
        : ri === rounds.length - 3 ? "ربع النهائي"
        : "دور " + (ri + 1);

      const statusTag = isDone
        ? '<span class="status-tag done">✓ منتهية</span>'
        : '<span class="status-tag live">● مباشر</span>';

      html += `
        <div class="match-card ${isDone?'done':'live'}">
          <div class="match-head">
            <span class="round-tag">${roundName}</span>
            ${statusTag}
          </div>
          <div class="match-teams">
            <div class="team-line ${aWin?'winner':''} ${isDone&&!aWin?'loser':''}">
              <div class="left">
                <div class="avatar" style="background:${teamColor(teamA)}">${teamEmoji(teamA)||a.name.charAt(0)}</div>
                <span class="name">${escapeHtml(a.name)}</span>
              </div>
              <span class="score">${m.scoreA!=null?m.scoreA:'-'}</span>
            </div>
            <div class="team-line ${bWin?'winner':''} ${isDone&&!bWin?'loser':''}">
              <div class="left">
                <div class="avatar" style="background:${teamColor(teamB)}">${teamEmoji(teamB)||b.name.charAt(0)}</div>
                <span class="name">${escapeHtml(b.name)}</span>
              </div>
              <span class="score">${m.scoreB!=null?m.scoreB:'-'}</span>
            </div>
          </div>
          <button class="match-btn ${isDone?'secondary':''}" data-ri="${ri}" data-mi="${mi}">
            <i class="fa-solid fa-${isDone?'pen':'play'}"></i>
            ${isDone ? 'تعديل النتيجة' : 'إدخال النتيجة'}
          </button>
        </div>`;
    });
  });

  // إذا ما في مباريات جاهزة
  const hasReady = rounds.some(r => r.some(m => m.a && m.b));
  if(!hasReady){
    html = `
      <div class="empty">
        <i class="fa-solid fa-clock"></i>
        لا توجد مباريات جاهزة الآن. البطولة قد تكون منتهية أو الفرق لم تتأهل.
      </div>`;
  } else {
    html += '</div>';
  }

  container.innerHTML = html;

  container.querySelectorAll("[data-ri]").forEach(btn => {
    btn.onclick = () => openScoreModal(parseInt(btn.dataset.ri), parseInt(btn.dataset.mi));
  });
}

function renderTeams(){
  const container = $("#teamsContainer");
  if(!container) return;
  $("#teamsCount").textContent = state.teams.length + " فريق";

  if(state.teams.length === 0){
    container.innerHTML = `<div class="empty"><i class="fa-solid fa-users-slash"></i>لا يوجد فرق. اضغط "جديد" للإضافة.</div>`;
    return;
  }

  container.innerHTML = state.teams.map(t => `
    <div class="team-row">
      <div class="avatar" style="background:${teamColor(t)}">${teamEmoji(t) || escapeHtml(t.name.charAt(0))}</div>
      <div class="info">
        <b>${escapeHtml(t.name)}</b>
        <small>${teamColor(t)}</small>
      </div>
      <div class="actions">
        <button class="edit" data-edit="${t.id}" title="تعديل"><i class="fa-solid fa-pen"></i></button>
        <button class="del" data-del="${t.id}" title="حذف"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
  `).join("");

  container.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => openEditTeam(teamById(btn.dataset.edit));
  });
  container.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = () => deleteTeam(teamById(btn.dataset.del));
  });
}

/* ============================================================
   MODAL HELPER
   ============================================================ */
function openModal(title, contentHTML, actionsHTML){
  const root = $("#modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <div class="modal-handle"></div>
        <h2>${title}</h2>
        ${contentHTML}
        ${actionsHTML || ''}
      </div>
    </div>`;
  const backdrop = $("#modalBackdrop");
  backdrop.addEventListener("click", e => {
    if(e.target === backdrop) closeModal();
  });
}

function closeModal(){
  $("#modalRoot").innerHTML = "";
}

/* ============================================================
   SCORE MODAL
   ============================================================ */
function openScoreModal(ri, mi){
  const tr = state.tournament;
  const m = tr.rounds[ri][mi];
  if(!m.a || !m.b){ toast("لم يتأهل الفريقان","error"); return; }

  const teamA = teamById(m.a.id);
  const teamB = teamById(m.b.id);

  const content = `
    <p>${ri===tr.rounds.length-1 ? "🏆 النهائي" : "الدور " + (ri+1)}</p>
    <div class="score-inputs">
      <div>
        <div class="team-name">${escapeHtml(m.a.name)}</div>
        <input type="number" id="sA" min="0" value="${m.scoreA!=null?m.scoreA:0}" inputmode="numeric">
      </div>
      <div class="score-vs">VS</div>
      <div>
        <div class="team-name">${escapeHtml(m.b.name)}</div>
        <input type="number" id="sB" min="0" value="${m.scoreB!=null?m.scoreB:0}" inputmode="numeric">
      </div>
    </div>

    <div class="penalty-row">
      <label><i class="fa-solid fa-circle-dot"></i> ركلات الترجيح (عند التعادل فقط)</label>
      <div class="row">
        <input type="number" id="pA" min="0" placeholder="ترجيح ${escapeHtml(m.a.name)}" value="${m.penA!=null?m.penA:''}" inputmode="numeric">
        <input type="number" id="pB" min="0" placeholder="ترجيح ${escapeHtml(m.b.name)}" value="${m.penB!=null?m.penB:''}" inputmode="numeric">
      </div>
    </div>

    <div class="field" style="margin-top:12px">
      <label><i class="fa-solid fa-star" style="color:var(--gold)"></i> أفضل لاعب (اختياري)</label>
      <select id="motm">
        <option value="">— بدون —</option>
        <option value="${m.a.id}" ${m.motm?.teamId===m.a.id?'selected':''}>${escapeHtml(m.a.name)}</option>
        <option value="${m.b.id}" ${m.motm?.teamId===m.b.id?'selected':''}>${escapeHtml(m.b.name)}</option>
      </select>
    </div>
  `;

  const actions = `
    <div class="modal-actions">
      <button class="btn btn-quiet" onclick="closeModal()"><i class="fa-solid fa-xmark"></i> إلغاء</button>
      <button class="btn btn-primary" id="saveScoreBtn"><i class="fa-solid fa-check"></i> حفظ</button>
    </div>
  `;

  openModal("نتيجة المباراة", content, actions);

  $("#saveScoreBtn").onclick = async () => {
    const sA = parseInt($("#sA").value||"0", 10);
    const sB = parseInt($("#sB").value||"0", 10);
    const pA = $("#pA").value === "" ? null : parseInt($("#pA").value, 10);
    const pB = $("#pB").value === "" ? null : parseInt($("#pB").value, 10);
    const motmVal = $("#motm").value;

    if(isNaN(sA) || isNaN(sB) || sA<0 || sB<0){
      toast("نتيجة غير صحيحة","error");
      return;
    }

    $("#saveScoreBtn").disabled = true;
    $("#saveScoreBtn").innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> يحفظ...';

    try {
      await API.post('/api/tournament/score', {
        roundIndex: ri, matchIndex: mi,
        scoreA: sA, scoreB: sB,
        penA: pA, penB: pB,
        motm: motmVal || null
      });
      toast("تم الحفظ ✓","success");
      closeModal();
    } catch(e){
      toast(e.message, "error");
      $("#saveScoreBtn").disabled = false;
      $("#saveScoreBtn").innerHTML = '<i class="fa-solid fa-check"></i> حفظ';
    }
  };
}

/* ============================================================
   TEAM MODAL (add / edit)
   ============================================================ */
function openEditTeam(team){
  const isNew = !team;
  const currentColor = team ? teamColor(team) : COLORS[state.teams.length % COLORS.length];
  const currentEmoji = team ? (teamEmoji(team)||EMOJIS[0]) : EMOJIS[state.teams.length % EMOJIS.length];
  let selectedColor = currentColor;
  let selectedEmoji = currentEmoji;

  const content = `
    <div class="field">
      <label>اسم الفريق</label>
      <input id="teamName" value="${team?escapeHtml(team.name):''}" placeholder="مثال: 1/6 أو فريق الصقور" maxlength="40">
    </div>

    <div class="field">
      <label>لون الفريق</label>
      <div style="display:flex;gap:7px;flex-wrap:wrap" id="colorRow">
        ${COLORS.map(c => `<div data-color="${c}" style="width:34px;height:34px;border-radius:9px;background:${c};border:2.5px solid ${c===currentColor?'var(--ink)':'transparent'};cursor:pointer;transition:.2s" class="color-pick"></div>`).join("")}
      </div>
    </div>

    <div class="field">
      <label>شعار الفريق (إيموجي)</label>
      <div style="display:flex;gap:5px;flex-wrap:wrap" id="emojiRow">
        ${EMOJIS.map(e => `<button type="button" data-emoji="${e}" style="width:36px;height:36px;border-radius:9px;background:${e===currentEmoji?'#e6eaff':'var(--paper)'};border:1.5px solid ${e===currentEmoji?'var(--blue)':'var(--line)'};font-size:17px;cursor:pointer" class="emoji-pick">${e}</button>`).join("")}
      </div>
    </div>
  `;

  const actions = `
    <div class="modal-actions">
      <button class="btn btn-quiet" onclick="closeModal()"><i class="fa-solid fa-xmark"></i> إلغاء</button>
      <button class="btn btn-primary" id="saveTeamBtn"><i class="fa-solid fa-check"></i> ${isNew?'إضافة':'حفظ'}</button>
    </div>
  `;

  openModal(isNew ? "فريق جديد" : "تعديل الفريق", content, actions);

  // Color picker
  $$(".color-pick").forEach(d => {
    d.onclick = () => {
      selectedColor = d.dataset.color;
      $$(".color-pick").forEach(x => x.style.borderColor = x.dataset.color === selectedColor ? 'var(--ink)' : 'transparent');
    };
  });

  // Emoji picker
  $$(".emoji-pick").forEach(b => {
    b.onclick = () => {
      selectedEmoji = b.dataset.emoji;
      $$(".emoji-pick").forEach(x => {
        const active = x.dataset.emoji === selectedEmoji;
        x.style.background = active ? '#e6eaff' : 'var(--paper)';
        x.style.borderColor = active ? 'var(--blue)' : 'var(--line)';
      });
    };
  });

  $("#saveTeamBtn").onclick = async () => {
    const name = $("#teamName").value.trim();
    if(!name){ toast("اكتب اسم الفريق","error"); return; }
    if(state.teams.some(t => t.id !== (team?.id) && t.name.toLowerCase() === name.toLowerCase())){
      toast("الاسم موجود","error"); return;
    }

    $("#saveTeamBtn").disabled = true;
    $("#saveTeamBtn").innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

    try {
      if(isNew){
        await API.post('/api/teams', { name, color: selectedColor, emoji: selectedEmoji });
        toast("تمت الإضافة ✓","success");
      } else {
        await API.put('/api/teams/' + team.id, { name, color: selectedColor, emoji: selectedEmoji });
        toast("تم التعديل ✓","success");
      }
      closeModal();
    } catch(e){
      toast(e.message, "error");
      $("#saveTeamBtn").disabled = false;
      $("#saveTeamBtn").innerHTML = '<i class="fa-solid fa-check"></i> حفظ';
    }
  };
}

async function deleteTeam(team){
  if(!team) return;
  if(!confirm(`حذف "${team.name}"؟`)) return;
  try {
    await API.del('/api/teams/' + team.id);
    toast("تم الحذف ✓","success");
  } catch(e){
    toast(e.message, "error");
  }
}

/* ============================================================
   HISTORY MODAL
   ============================================================ */
function openHistory(){
  if(state.history.length === 0){
    openModal("سجل الأبطال", `
      <div class="empty"><i class="fa-solid fa-crown"></i>لا يوجد سجل بعد. أكمل بطولة لدخول السجل.</div>
    `, `<div class="modal-actions"><button class="btn btn-quiet" onclick="closeModal()">إغلاق</button></div>`);
    return;
  }

  const list = state.history.map((h, i) => `
    <div style="padding:12px;background:var(--paper);border-radius:11px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
      <div style="width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#d19b2e);color:#2a1e05;display:grid;place-items:center;font-size:18px;flex:none">${i===0?'👑':'🏆'}</div>
      <div style="flex:1;min-width:0">
        <b style="display:block;font-size:13px;font-weight:900">${escapeHtml(h.championName)}</b>
        <small style="color:var(--muted);font-size:10.5px">${h.teamsCount} فريق · ${h.totalGoals||0} هدف</small>
      </div>
    </div>
  `).join("");

  openModal("سجل الأبطال (" + state.history.length + ")", `
    <div style="max-height:60vh;overflow-y:auto;margin-top:10px">${list}</div>
  `, `<div class="modal-actions"><button class="btn btn-quiet" onclick="closeModal()">إغلاق</button></div>`);
}

/* ============================================================
   ACTIONS
   ============================================================ */
$("#addTeamBtn").onclick = () => openEditTeam(null);

$("#refreshBtn").onclick = () => {
  boot();
  toast("تحديث","success");
};

$("#genTourBtn").onclick = async () => {
  if(state.teams.length < 2){
    toast("أضف فريقين على الأقل","error");
    return;
  }
  const how = confirm("ترتيب عشوائي؟\n\nموافق = عشوائي\nإلغاء = حسب الترتيب");
  let order = state.teams.map(t => t.id);
  if(how){
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  if(!confirm(state.tournament ? "يوجد بطولة حالية — ستُحذف. متابعة؟" : "توليد بطولة جديدة؟")) return;

  try {
    await API.post('/api/tournament/generate', { order });
    toast("تم توليد البطولة ✓","success");
  } catch(e){
    toast(e.message, "error");
  }
};

$("#historyBtn").onclick = openHistory;

$("#viewSiteBtn").onclick = () => window.open('/', '_blank');

/* ============================================================
   AUTO-LOGIN
   ============================================================ */
(async function init(){
  if(API.adminPass){
    try {
      await API.get('/api/teams');
      $("#loginScreen").classList.add("hidden");
      $("#app").classList.remove("hidden");
      boot();
    } catch(e){
      API.adminPass = "";
      sessionStorage.removeItem('adminPass');
    }
  }
  $("#passInput").focus();
})();
</script>
</body>
</html>
